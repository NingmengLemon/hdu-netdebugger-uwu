name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 默认最小权限；下面的 job 只读取仓库内容
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt 在没有显示器的 runner 上需要离屏插件
  QT_QPA_PLATFORM: offscreen
  # 让 Python 输出立刻可见，方便看 CI 日志
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-groups --extra gui

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: ty check
        run: uv run ty check

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # PySide6 的 wheel 自带 Qt 库，但仍依赖系统的 libGL / libEGL / xkbcommon。
      # 缺了它们 `import PySide6` 会失败 —— GUI 测试模块在收集期直接报错，
      # 所以这里必须先装齐系统库。
      - name: 安装 Linux 下 Qt 所需的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxrender1 libxi6 \
            fonts-wqy-zenhei

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-groups --extra gui --python ${{ matrix.python }}

      - name: 确认 GUI 依赖真的可用
        run: |
          uv run python -c "from hdu_netdebugger.gui.app import run_app; print('GUI 可导入')"
          uv run python -c "from PySide6.QtWidgets import QApplication; print('PySide6 可导入')"

      - name: 运行测试（含覆盖率门槛）
        run: uv run pytest

      - name: 上传覆盖率报告
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 构建
        run: uv build

      - name: 校验构建产物可以安装并给出命令行入口
        run: |
          uv venv --python 3.12 /tmp/verify
          uv pip install --python /tmp/verify dist/*.whl
          /tmp/verify/bin/hnd --version
          /tmp/verify/bin/hnd list

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/

  exe:
    name: exe (可执行文件) ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            experimental: false
          - os: ubuntu-latest
            experimental: false
          # macOS 可以构建（PyInstaller 不跨平台编译，只能在目标平台上打），
          # 而且下面的冒烟会真的跑一遍冻结产物（含 ping 的 darwin 参数路径）；
          # 维护者手上没有 Mac，所以标成实验性：失败不阻塞发布，但产物照样上传。
          - os: macos-latest
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # 冻结的 GUI 冒烟要真的加载 Qt 平台插件；Linux runner 必须先装齐系统库
      - name: 安装 Linux 下 Qt 所需的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxrender1 libxi6 \
            fonts-wqy-zenhei

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖（含 build 组与 GUI extra）
        run: uv sync --all-groups --extra gui

      - name: 打包（必须在项目根目录执行，理由见 spec 注释）
        run: uv run --group build pyinstaller --clean --noconfirm packaging/hnd.spec

      - name: 冻结产物冒烟（CLI 版本/list/doctor + 离屏 GUI 截图）
        run: uv run python scripts/dist_smoke.py

      # CLI 是 onefile：Windows 下产物叫 dist/hnd.exe，类 Unix 下叫 dist/hnd。
      # 归一到一个目录里，上传路径就不必写平台分支。
      - name: 归一化 CLI 产物路径
        shell: bash
        run: |
          mkdir -p dist/cli
          mv dist/hnd dist/cli/ 2>/dev/null || mv dist/hnd.exe dist/cli/

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: hnd-exe-${{ runner.os }}
          path: |
            dist/cli
            dist/HDU-NetDebugger
          if-no-files-found: error
