name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 默认最小权限；下面的 job 只读取仓库内容
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt 在没有显示器的 runner 上需要离屏插件
  QT_QPA_PLATFORM: offscreen
  # 让 Python 输出立刻可见，方便看 CI 日志
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-groups --extra gui

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: ty check
        run: uv run ty check

  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # PySide6 的 wheel 自带 Qt 库，但仍依赖系统的 libGL / libEGL / xkbcommon。
      # 缺了它们 `importorskip("PySide6")` 会静默跳过 GUI 测试 —— 测试照样"通过"，
      # 但 Linux 上的 GUI 覆盖被悄悄丢掉了。所以显式装齐。
      - name: 安装 Linux 下 Qt 所需的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxrender1 libxi6 \
            fonts-wqy-zenhei

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --all-groups --extra gui --python ${{ matrix.python }}

      - name: 确认 GUI 依赖真的可用（而不是被 importorskip 静默跳过）
        run: |
          uv run python -c "from hdu_netdebugger.gui.app import run_app; print('GUI 可导入')"
          uv run python -c "from PySide6.QtWidgets import QApplication; print('PySide6 可导入')"

      - name: 运行测试（含覆盖率门槛）
        run: uv run pytest

      - name: 上传覆盖率报告
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 构建
        run: uv build

      - name: 校验构建产物可以安装并给出命令行入口
        run: |
          uv venv --python 3.12 /tmp/verify
          uv pip install --python /tmp/verify dist/*.whl
          /tmp/verify/bin/hnd --version
          /tmp/verify/bin/hnd list

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
